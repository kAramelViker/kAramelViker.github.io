[package]
name = "egui_timepicker"
authors = ["Tilen Pintarič <tilen@pintaric.si>"]
description = "A time picker widget for egui"
license = "MIT"
readme = "README.md"
repository = "https://codeberg.org/pintariching/egui_timepicker"
categories = ["gui"]
keywords = ["egui", "time", "picker"]
include = ["**/*", "LICENSE", "README.md", "Cargo.toml"]
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = "0.4.42"
egui = "0.36.1"
serde = { version = "1.0.228", optional = true, features = ["derive"] }

[lib]

[features]
serde = ["dep:serde"]
